id: G20
name: Stale cost assumption — runs, but the DQ report must say so
description: |
  Production cost sourced in 2021. Older than the 365-day maximum -> MAJOR, score reduced,
  gate still passes. The reproducibility record carries the DQ report so the staleness is
  visible to whoever reads the decision later.
units: {mass: t, currency: USD, energy: MWh, time: period}
periods: [t1]
sites:
  - id: A
    production_cost: 100
    base_capacity: 1000
    provenance:
      production_cost: {source: "2021 feasibility study", as_of: 2021-03-01}
customers:
  - {id: C1, demand: {t1: 100}}
routes:
  - {from: A, to: C1, cost: 10}
expected:
  status: optimal
  objective: 11000
  dq: {gate: true, max_score: 90, findings_include: [provenance.stale]}
