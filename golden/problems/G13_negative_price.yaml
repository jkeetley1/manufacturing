id: G13
name: Negative commodity price — refuse to run
description: |
  A negative production cost lets the optimiser earn money by producing. The model must
  refuse the data, and the Data Auditor must block it before the model is even reached.
units: {mass: t, currency: USD, energy: MWh, time: period}
periods: [t1]
sites:
  - {id: A, production_cost: -100, base_capacity: 1000}
customers:
  - {id: C1, demand: {t1: 100}}
routes:
  - {from: A, to: C1, cost: 10}
expected:
  status: data_error
  error_contains: "negative production_cost"
  dq: {gate: false, findings_include: [value.negative]}
