id: G01
name: Cheapest plant
description: |
  Two plants, identical transport, ample capacity. Demand of 100 t.
  All production must come from the cheaper plant.
  Hand solution: A at $100/t + $10/t transport = $110/t vs B $130/t. Cost = 100 × 110 = 11,000.
units: {mass: t, currency: USD, energy: MWh, time: period}
periods: [t1]
discount_rate: 0.0
sites:
  - {id: A, production_cost: 100, base_capacity: 1000}
  - {id: B, production_cost: 120, base_capacity: 1000}
customers:
  - {id: C1, demand: {t1: 100}}
routes:
  - {from: A, to: C1, cost: 10}
  - {from: B, to: C1, cost: 10}
expected:
  status: optimal
  objective: 11000
  production: {A: {t1: 100}, B: {t1: 0}}
  tolerance: 1.0e-6
