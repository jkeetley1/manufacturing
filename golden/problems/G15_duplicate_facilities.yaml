id: G15
name: Duplicate facilities — exact and fuzzy
description: |
  Site 'A' appears twice (exact duplicate, BLOCKER) and 'gladstone' / 'Gladstone ' are
  fuzzy duplicates (MAJOR). The model must also refuse to build.
units: {mass: t, currency: USD, energy: MWh, time: period}
periods: [t1]
sites:
  - {id: A, production_cost: 100, base_capacity: 1000}
  - {id: A, production_cost: 100, base_capacity: 1000}
  - {id: Gladstone, production_cost: 100, base_capacity: 1000}
  - {id: "gladstone ", production_cost: 100, base_capacity: 1000}
customers:
  - {id: C1, demand: {t1: 100}}
routes:
  - {from: A, to: C1, cost: 10}
  - {from: Gladstone, to: C1, cost: 10}
  - {from: "gladstone ", to: C1, cost: 10}
expected:
  status: data_error
  error_contains: "duplicate site id"
  dq: {gate: false, findings_include: [duplicate.site, duplicate.site_fuzzy]}
