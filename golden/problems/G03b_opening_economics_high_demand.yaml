id: G03b
name: Plant-opening economics — high demand favours low variable cost
description: |
  Same plants as G03a, demand 100.
  A alone: 2,000 + 100×110 = 13,000. B alone: 500 + 100×130 = 13,500.
  Expected: open A only. Objective 13,000. Break-even demand is 75 t.
units: {mass: t, currency: USD, energy: MWh, time: period}
periods: [t1]
sites:
