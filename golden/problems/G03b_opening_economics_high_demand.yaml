  - {id: B, production_cost: 120, fixed_cost: 500,  base_capacity: 100}
customers:
  - {id: C1, demand: {t1: 100}}
routes:
  - {from: A, to: C1, cost: 10}
  - {from: B, to: C1, cost: 10}
expected:
  status: optimal
  objective: 13000
  production: {A: {t1: 100}, B: {t1: 0}}
  open: {A: {t1: 1}, B: {t1: 0}}
