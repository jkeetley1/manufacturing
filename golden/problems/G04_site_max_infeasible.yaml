id: G04
name: Site maximum capacity — must report infeasible (OPT-143 acceptance test)
description: |
  Single candidate site, site maximum 500 ktpa, demand 900 ktpa.
  The model must report infeasible with a diagnosis. It must NOT produce 900 from the site.
  Note: the Data Auditor flags this as a MAJOR warning but does not block it — the model
  itself must fail correctly.
units: {mass: t, currency: USD, energy: MWh, time: period}
periods: [t1]
sites:
  - {id: A, production_cost: 100, base_capacity: 900, site_max_capacity: 500}
customers:
  - {id: C1, demand: {t1: 900}}
routes:
  - {from: A, to: C1, cost: 10}
expected:
  status: infeasible
  diagnosis_contains: "exceeds"
  dq: {gate: true, findings_include: [feasibility.demand_exceeds_capacity]}
