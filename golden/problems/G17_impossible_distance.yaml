id: G17
name: Impossible transport distance — shorter than great-circle
description: |
  Gladstone (-23.85, 151.26) to Brisbane (-27.47, 153.03) is ~440 km great-circle.
  A stated road distance of 300 km is physically impossible -> BLOCKER.
  A second route at 2,600 km (2.4× the ~1,100 km great-circle) is implausible -> MAJOR.
