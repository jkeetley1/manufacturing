name: Golden problems & controls

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  golden:
    name: golden-problems
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run golden problems against reference ranges
        run: python tools/run_golden.py --problems golden_problems --ranges reference_ranges

  changelog:
    name: changelog-required
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md entry when controlled artefacts change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "$changed"
          if echo "$changed" | grep -qE '^(assumptions|reference_ranges|golden_problems)/'; then
            if ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
              echo "::error::Controlled artefact changed without a CHANGELOG.md entry."
              exit 1
            fi
          fi
          echo "Change-log check passed."
