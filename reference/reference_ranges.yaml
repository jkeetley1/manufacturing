# Shared plausibility bands used by BOTH the Agent Auditor ("commercially absurd?")
# and the Data Auditor ("unit or currency error?").
#
# CONTROLLED ARTEFACT. Changes require a logged, attributable entry in
# reference/assumption_change_log.md and human approval. Agents may propose,
# never approve.
#
# Bands are deliberately wide: they catch 1000x unit errors and currency
# mix-ups, not ordinary commercial variation. Tighten per commodity once the
# platform is scoped to one product.

version: 1
as_of: 2026-09-05

plausibility:
  production_cost_usd_per_t:       {min: 5,     max: 20000}
  transport_cost_usd_per_t:        {min: 0.5,   max: 2000}
  expansion_capex_usd_per_unit:    {min: 1000,  max: 5000000000}
  electricity_price_usd_per_mwh:   {min: 10,    max: 600}
  plant_utilisation_fraction:      {min: 0.30,  max: 1.00}

geography:
  # stated road distance / great-circle distance
  road_ratio_min: 1.0     # below this is physically impossible -> BLOCKER
  road_ratio_max: 2.0     # above this is suspect -> MAJOR

provenance:
  max_age_days: 365
