id: D02
name: Asahi-inspired east-coast DC network — 6 candidate sites, 3 markets, 5 periods
description: 'Grounded in Asahi Beverages'' PUBLIC three-DC national program (Deer Park VIC under way; Redbank QLD
  $150M, operational 2028; third Sydney DC announced) and its published manufacturing footprint (Yatala, Wulkuraka
  QLD; Laverton, Tullamarine, Abbotsford VIC). Locations and program facts are public; ALL volumes and unit costs
  are illustrative analyst estimates and are NOT Asahi data. Decision modelled: which DCs to build, at what capacity,
  when, to serve east-coast demand at minimum NPV cost. Single-echelon simplification: inbound plant->DC freight
  is folded into each DC''s per-tonne cost (VIC cheapest: three co-located plants; NSW dearest: no local manufacturing).
  A two-echelon formulation is a Spec amendment for the Optimisation Scientist.'
